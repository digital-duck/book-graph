[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "book-graph"                 # the PyPI name; the Python package is `bookgraph`
version = "0.1.0"
description = "Concept-books from graphs over GraphLang: a graph.yaml per chapter in, a published concept-book out (press > book > chapter)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"             # graflang needs 3.11
dependencies = [
    "networkx>=3.2",
    "pyyaml>=6.0",
    "click>=8.1",
    "zinet>=0.2.0",           # the graph algorithms (order, reducibility) shared with GraphLang, app-graph and work-graph
    "graflang>=0.3.0,<0.4",   # the recipes run on the GraphLang runtime (package `graphlang`)
    "dd-llm>=0.2.0",          # the LLM adapters, shared with GraphLang, app-graph and work-graph
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/digital-duck/book-graph"
Repository = "https://github.com/digital-duck/book-graph"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
bookgraph = "bookgraph.cli:main"
bgr = "bookgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bookgraph = ["recipes/**/*.yaml", "recipes/**/*.md", "recipes/**/*.cedar", "web/**/*", "web/public/.nojekyll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:spark"
